<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Custom Css -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@100..800&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <title>TodoApp</title>
    <style>
        body {
            font-family: SUSE, open-sans;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <div class="container mt-3 w-50">
        <!-- Head start -->
        <div class="card">
            <div id="title" class="card-header text-center display-4 text-primary bg-white">
                TodoApp
            </div>
            <div class="card-body">
                <form>
                    <div class="input-group">
                        <input id="txt-task-decription" class="form-control" type="text" name="" id="">
                        <button type="submit" id="btn-add-task" class="btn btn-success">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-header d-flex justify-content-between align-items-center bg-white mb-1 border-bottom-0 ">
                <div id="filters" class="fs-5 d-flex gap-3">
                    <span id="all" class="active">Tüm Görevler</span>
                    <span id="pending">Bekleyen Görevler</span>
                    <span id="completed">Tamamlanan Görevler</span>
                </div>
                <div>
                    <button id="btn-clear-all" class="btn btn-danger">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Head end -->
        <div class="card mt-3">
            <ul id="task-list" class="list-group">

                
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
